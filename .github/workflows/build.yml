name: Build

on:
  push:
    branches: [main, 'support/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main, 'support/**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.gitignore']

jobs:
  # Listed first and independent of Fabric/NeoForge so the Paper jars land in
  # Artifacts as soon as this job greens — typically minutes before the Fabric
  # gametests finish.
  paper:
    name: Paper
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Line identity comes from .github/line.env (R2-2 — build.yml used to hardcode
      # the Java version and went red-by-construction on the Java-21 line).
      - name: Source line env
        run: grep -vE '^\s*(#|$)' .github/line.env >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LINE_JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Paper plugin
        run: ./gradlew :paper:shadowJar

      - name: Paper Tier 1 tests
        run: ./gradlew :paper:test

      - name: Release-jar safety gate (Paper)
        run: python3 scripts/release_check.py --families paper

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-failure-evidence-paper
          path: |
            paper/build/reports/
            paper/build/test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stage Paper jars
        run: |
          bash scripts/ci_stage_jars.sh lod-server-support-paper paper/build/libs lod-server-support-paper.jar
          bash scripts/ci_stage_jars.sh voxy-server-side-paper paper/build/libs voxy-server-side-paper.jar

      - uses: actions/upload-artifact@v7
        with:
          path: ci-jars/lod-server-support-paper.jar
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ci-jars/voxy-server-side-paper.jar
          archive: false
          if-no-files-found: error

  build:
    name: Fabric + NeoForge
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Line identity comes from .github/line.env (R2-2 — build.yml used to hardcode
      # the Java version and went red-by-construction on the Java-21 line).
      - name: Source line env
        run: grep -vE '^\s*(#|$)' .github/line.env >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LINE_JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Fabric + Tier 1 tests
        run: ./gradlew :fabric:build -x runGameTest -x runClientGameTest

      # Tier 2 runs a real dedicated server; on starved 2-core runners the documented
      # flaky classes (CLAUDE.md "Known Test Flakes") can miss timing windows. One retry
      # contains them; the ::warning:: keeps every retry visible in the run summary so a
      # rising flake rate is never silently masked, and the first attempt's evidence is
      # snapshotted before the retry clobbers the run dir.
      - name: Tier 2 server gametests (retry once on flake)
        run: |
          ./gradlew :fabric:runGameTest || {
            echo "::warning title=Tier 2 gametest flake::runGameTest failed once; retrying (first-attempt logs in the gametest-flake-evidence-server artifact)"
            mkdir -p flake-evidence/tier2
            cp -r fabric/build/run/gameTest/logs flake-evidence/tier2/logs 2>/dev/null || true
            cp -r fabric/build/run/gameTest/crash-reports flake-evidence/tier2/crash-reports 2>/dev/null || true
            ./gradlew :fabric:runGameTest
          }

      # Stage N: the NeoForge module (best-effort tier — CLAUDE.md "Support tiers").
      # build = compile (xplat under MDG — the twin-contract enforcement) + the contract
      # suite + shadowJar + the VSS repackage; the gametest smoke runs the 8-test subset
      # with the same retry-once + evidence pattern as the fabric tiers.
      - name: Build NeoForge + contract tests
        run: ./gradlew :neoforge:build

      - name: NeoForge gametest smoke (retry once on flake)
        run: |
          ./gradlew :neoforge:runGameTestServer || {
            echo "::warning title=NeoForge gametest flake::runGameTestServer failed once; retrying (first-attempt logs in the gametest-flake-evidence-server artifact under neoforge/)"
            mkdir -p flake-evidence/neoforge
            cp -r neoforge/run/logs flake-evidence/neoforge/logs 2>/dev/null || true
            cp -r neoforge/run/crash-reports flake-evidence/neoforge/crash-reports 2>/dev/null || true
            ./gradlew :neoforge:runGameTestServer
          }

      - name: Soak checker + report selftests
        run: |
          python3 scripts/check_soak.py --selftest
          python3 scripts/soak_report.py --selftest
          python3 scripts/release_check.py --selftest
          python3 scripts/check_move_trace.py --selftest
          python3 scripts/compare_profile.py --selftest

      - name: Release-jar safety gate
        run: python3 scripts/release_check.py --families fabric,neoforge

      - name: Upload flake evidence (first attempt of a retried gametest)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-flake-evidence-server
          path: flake-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-failure-evidence-server
          path: |
            fabric/build/run/*/logs/
            fabric/build/run/*/crash-reports/
            fabric/build/reports/
            fabric/build/test-results/
            neoforge/build/reports/
            neoforge/build/test-results/
            neoforge/run/logs/
            neoforge/run/crash-reports/
          if-no-files-found: ignore
          retention-days: 30

      # Direct (unzipped) jar downloads: upload-artifact v7 `archive: false` (GitHub
      # changelog 2026-02-26) so the Actions UI hands back the .jar itself, not a zip
      # wrapper. archive: false accepts exactly one file and names the artifact after
      # that file (`name:` is ignored). Stage to stable filenames so a sources/dev
      # sibling in build/libs cannot make the glob resolve to two files.
      - name: Stage Fabric and NeoForge jars
        run: |
          bash scripts/ci_stage_jars.sh lod-server-support-fabric fabric/build/libs lod-server-support-fabric.jar
          bash scripts/ci_stage_jars.sh voxy-server-side-fabric fabric/build/libs voxy-server-side-fabric.jar
          bash scripts/ci_stage_jars.sh lod-server-support-neoforge neoforge/build/libs lod-server-support-neoforge.jar
          bash scripts/ci_stage_jars.sh voxy-server-side-neoforge neoforge/build/libs voxy-server-side-neoforge.jar

      - uses: actions/upload-artifact@v7
        with:
          path: ci-jars/lod-server-support-fabric.jar
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ci-jars/voxy-server-side-fabric.jar
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ci-jars/lod-server-support-neoforge.jar
          archive: false
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          path: ci-jars/voxy-server-side-neoforge.jar
          archive: false
          if-no-files-found: error

  # Tier 3: the only end-to-end pins for the client-server flow, LSSApi consumer
  # dispatch, the ingest-failure recovery loop, and the IntegratedServerLanHook path.
  # Runs headless via llvmpipe (same env the original Tier-3 job used on these runners).
  client-gametest:
    name: Client GameTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Line identity comes from .github/line.env (R2-2 — build.yml used to hardcode
      # the Java version and went red-by-construction on the Java-21 line).
      - name: Source line env
        run: grep -vE '^\s*(#|$)' .github/line.env >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.LINE_JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v5

      # Retry-once for the same reason as Tier 2 above — this tier additionally sees the
      # vanilla 26.2 TicketStorage purge crash under ticket churn (CLAUDE.md flake catalog).
      - name: Tier 3 client gametests (retry once on flake)
        run: |
          ./gradlew :fabric:runClientGameTest || {
            echo "::warning title=Tier 3 gametest flake::runClientGameTest failed once; retrying (first-attempt logs in the gametest-flake-evidence-client artifact)"
            mkdir -p flake-evidence/tier3
            cp -r fabric/build/run/clientGameTest/logs flake-evidence/tier3/logs 2>/dev/null || true
            cp -r fabric/build/run/clientGameTest/crash-reports flake-evidence/tier3/crash-reports 2>/dev/null || true
            ./gradlew :fabric:runClientGameTest
          }
        timeout-minutes: 35
        env:
          MESA_GL_VERSION_OVERRIDE: "4.5"
          GALLIUM_DRIVER: llvmpipe

      - name: Upload flake evidence (first attempt of a retried gametest)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-flake-evidence-client
          path: flake-evidence/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gametest-failure-evidence-client
          path: |
            fabric/build/run/clientGameTest/logs/
            fabric/build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
          retention-days: 30
