name: Release

on:
  push:
    # Deliberately the broad v* glob: GitHub's filter-pattern language treats '+' as a
    # quantifier, so any pattern containing '*+' (e.g. '!v*+mc*') is INVALID and turns
    # every push into a phantom failed run — worse, a real tag push would trigger NOTHING.
    # The wrong-line protection lives in the guard step below instead, where '+' is
    # literal shell text. (The support branches' release.yml scope the same way.)
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A support-line tag (v0.8.0+mc26.1 etc.) mistakenly pushed onto a main commit must
      # not publish: it would ship 26.2 jars under a support-line name, and the +mc suffix
      # would corrupt -Pmod_version below. This cannot live in the on.push.tags filter —
      # see the comment there.
      - name: Refuse support-line tags
        run: |
          case "${GITHUB_REF_NAME}" in
            *+mc*) echo "::error::${GITHUB_REF_NAME} is a support-line tag — the mainline release.yml must not publish it"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract release notes from tag
        id: release_notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # actions/checkout leaves a LIGHTWEIGHT tag on tag-triggered runs, which drops the
          # annotated tag's message (our release notes) and makes objecttype read 'commit'. Re-fetch
          # the real annotated object so the notes below are used instead of the commit-subject
          # fallback. Non-fatal (|| true): a fetch hiccup degrades to the fallback, never blocks publish.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true

          # Annotated tags have objecttype 'tag'; lightweight have 'commit'
          TAG_TYPE=$(git for-each-ref --format='%(objecttype)' "refs/tags/${TAG}")
          if [ "$TAG_TYPE" = "tag" ]; then
            NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")
          else
            NOTES=""
          fi

          # Fallback for lightweight tags: commit subjects as bullet list.
          # grep -v '+mc' keeps support-line tags (v0.8.0+mc26.1 etc.) out of the mainline
          # PREV_TAG — version-sort would otherwise slot them adjacent to this line's tags
          # and span the notes/compare across release lines.
          if [ -z "$NOTES" ]; then
            PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | grep -v '+mc' | head -1 || true)
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --format="- %s" "${PREV_TAG}..${TAG}")
            else
              NOTES=$(git log --format="- %s" "${TAG}")
            fi
          fi

          # Append compare link (same +mc exclusion as above)
          # `|| true`: under `set -euo pipefail`, grep -v exits 1 (aborting the step) when the
          # pushed tag is the only v* tag — i.e. the first-ever release. Tolerate the empty result.
          PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "^${TAG}$" | grep -v '+mc' | head -1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          else
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${TAG}"
          fi
          NOTES=$(printf '%s\n\n**Full Changelog**: %s' "$NOTES" "$COMPARE")

          {
            echo "notes<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric
        run: ./gradlew :fabric:build -x runClientGameTest -Pmod_version=${GITHUB_REF_NAME#v}

      # :paper:test gates the publish — :paper:shadowJar alone has no test dependency,
      # and this pipeline ships the Paper jar to three loaders irreversibly.
      - name: Build Paper + Tier 1 tests
        run: ./gradlew :paper:test :paper:shadowJar -Pmod_version=${GITHUB_REF_NAME#v}

      # Stage N (best-effort tier): :neoforge:build = xplat compile under MDG (the
      # twin-contract enforcement) + the contract suite + shadowJar + the VSS repackage.
      - name: Build NeoForge + contract tests
        run: ./gradlew :neoforge:build -Pmod_version=${GITHUB_REF_NAME#v}

      # Gate the tag-versioned artifacts that actually ship (build.yml gates only the default-version
      # CI build). GitHub Actions exports CI=true, so the build steps above produced CI-named jars
      # that release_check's RELEASE_GLOBS match. Runs after the builds, before the irreversible publish.
      - name: Release-jar safety gate
        run: python3 scripts/release_check.py --version "${GITHUB_REF_NAME#v}"

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          # Without this, a glob matching nothing publishes an empty release silently;
          # failing here also stops the Modrinth steps from running against missing jars.
          fail_on_unmatched_files: true
          # The LSS pair only. VSS publishing is disabled as of v0.8.0 (the vssJar tasks
          # still BUILD the branded byte-copies and release_check still gates the pair —
          # only distribution is off, matching the support branches).
          files: |
            fabric/build/libs/lod-server-support-fabric-*.jar
            paper/build/libs/lod-server-support-paper-*.jar
            neoforge/build/libs/lod-server-support-neoforge-*.jar

      - name: Upload Fabric to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: fabric/build/libs/lod-server-support-fabric-*.jar
          name: ${{ github.ref_name }} - Fabric (MC 26.2)
          version: ${{ github.ref_name }}+fabric+mc26.2
          version-type: release
          loaders: fabric
          game-versions: |
            26.2
          changelog: ${{ steps.release_notes.outputs.notes }}

      # Stage N (neoforge-support-plan.md §4.2): the version NAME carries the
      # server-side caveat — Modrinth search results and version lists never render
      # release notes, and on 26.2 no community Voxy build exists yet, so the client
      # half ships compiled-and-inert (plan §0.1). Best-effort tier (CLAUDE.md).
      - name: Upload NeoForge to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: neoforge/build/libs/lod-server-support-neoforge-*.jar
          name: ${{ github.ref_name }} - NeoForge (MC 26.2, server-side; client needs a community Voxy build)
          version: ${{ github.ref_name }}+neoforge+mc26.2
          version-type: release
          loaders: neoforge
          game-versions: |
            26.2
          changelog: ${{ steps.release_notes.outputs.notes }}

      - name: Upload Paper to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: lKiXKLvv
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: paper/build/libs/lod-server-support-paper-*.jar
          name: ${{ github.ref_name }} - Paper/Purpur/Folia (MC 26.2)
          version: ${{ github.ref_name }}+paper+mc26.2
          version-type: release
          # Folia re-added for v0.9.0: all three preconditions the previous comment named
          # are met — Folia published 26.2-1 on 2026-07-28, the jar declares
          # folia-supported again (PluginYmlContractTest + release_check pin its PRESENCE),
          # and all four SOAK_PLATFORM=folia scenarios passed 2026-08-01. This step was the
          # last piece still advertising the old state, which left plugin.yml and the README
          # claiming Folia while Modrinth's loader filter hid the jar from Folia admins.
          # Folia remains EXPERIMENTAL (single-player soaks only; concurrent multi-region
          # ingress is still unvalidated) — that is a release-notes caveat, not a reason to
          # withhold a jar the platform can actually load.
          loaders: |
            paper
            purpur
            folia
          game-versions: |
            26.2
          changelog: ${{ steps.release_notes.outputs.notes }}
